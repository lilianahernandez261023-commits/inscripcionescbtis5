<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripción al CBTis No. 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-container">
        <h1>Inscripción al CBTis No. 5</h1>
        <p>Bienvenido al CBTis No. 5, a continuación debes llenar el siguiente formulario con tus datos personales para llevar a cabo tu inscripción.</p>

        <form action="#" method="POST">
            
            <fieldset>
                <legend>DATOS DEL ASPIRANTE</legend>

                <div class="form-group">
                    <label for="apellido">Apellido paterno:</label>
                    <input type="text" id="apellido" name="apellido" required>
                </div>

                <div class="form-group">
                    <label for="nombre">Nombre (s):</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="form-group">
                    <label for="curp">CURP:</label>
                    <input type="text" id="curp" name="curp" maxlength="18" required>
                </div>

                <div class="form-group">
                    <label for="fecha_nacimiento">Fecha de nacimiento:</label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
                </div>

                <div class="form-group">
                    <label>Sexo:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="sexo" value="Femenino"> Femenino</label>
                        <label><input type="radio" name="sexo" value="Masculino"> Masculino</label>
                        <label><input type="radio" name="sexo" value="Otro"> Otro</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="lugar_nacimiento">Lugar de nacimiento:</label>
                    <input type="text" id="lugar_nacimiento" name="lugar_nacimiento" required>
                </div>

                <div class="form-group">
                    <label for="celular">Número de celular:</label>
                    <input type="tel" id="celular" name="celular" required>
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>DATOS ACADEMICOS</legend>

                <div class="form-group">
                    <label for="secundaria">Secundaria:</label>
                    <input type="text" id="secundaria" name="secundaria" required>
                </div>

                <div class="form-group">
                    <label for="cct">CCT:</label>
                    <input type="text" id="cct" name="cct" required>
                </div>

                <div class="form-group">
                    <label for="promedio">Promedio:</label>
                    <input type="number" step="0.01" min="0" max="10" id="promedio" name="promedio" required>
                </div>

                <div class="form-group">
                    <label for="anio_egreso">Año de egreso:</label>
                    <input type="number" id="anio_egreso" name="anio_egreso" required>
                </div>

                <div class="form-group">
                    <label>Turno:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="turno" value="Matutino"> Matutino</label>
                        <label><input type="radio" name="turno" value="Vespertino"> Vespertino</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>¿Estuvo inscrito en otra institución de educación media superior?</label>
                    <div class="radio-group">
                        <label><input type="radio" name="otra_institucion" value="si"> Sí</label>
                        <label><input type="radio" name="otra_institucion" value="no"> No</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="carreras">Carreras:</label>
                    <select id="carreras" name="carreras">
                        <option value="programacion">Programación</option>
                        <option value="contabilidad">Contabilidad</option>
                        <option value="mecanica">Mecánica Industrial</option>
                        <option value="electricidad">Electricidad</option>
                    </select>
                </div>
            </fieldset>

            <button type="submit" class="btn-submit">Enviar Registro</button>
        </form>
    </div>

</body>
</html>
